name: Showcase checks

on:
  push:
    branches: [showcase/wandb-agent-lens]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: showcase/requirements.lock
      - run: python -m pip install --require-hashes -r showcase/requirements.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m pip install pytest==8.4.2 ruff==0.14.1
      - run: python -m pytest tests/test_workflow.py tests/showcase -q
      - run: ruff check harness2/showcase tests/showcase showcase/worker.py showcase/package_demo.py showcase/render_walkthrough.py showcase/publish_wandb_demo.py
      - run: ruff format --check harness2/showcase tests/showcase showcase/worker.py showcase/package_demo.py showcase/render_walkthrough.py showcase/publish_wandb_demo.py
